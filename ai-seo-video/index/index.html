// ---------- primitives ----------

// find a spoken word (tries several spellings), local time or fallback
function fw(i,w,n=0,fb=0){const ws=Array.isArray(w)?w:[w];for(const q of ws){const m=S[i].words.filter(o=>o.w.toLowerCase().replace(/[^a-z0-9.'-]/g,'')===q.toLowerCase());if(m[n]||m[0])return (m[n]||m[0]).t-S[i].start}return fb}

  for(let i=1;i<Math.min(n,4);i++)rr(px+w*.12,py+h*.16+i*h*.19,w*(.76-(i%2)*.18),Math.max(3,h*.06),3,'#e5e7eb');x.restore()}

const SC=[
// 0 HOOK: indexed pages chart drops, pages blink out
t=>{head(0,t);const td=fw(0,'disappearing',0,1.5),tw=fw(0,'why',0,3.5);const a=eo(pr(t,.2,.4));if(a<=0)return;x.save();x.globalAlpha*=a;
