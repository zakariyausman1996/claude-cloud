<style>

@font-face{font-family:Inter;font-weight:600;src:url(fonts/inter-600.woff2)}

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
const W=1080,H=1920,c=document.getElementById('c'),X=c.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const O=off.getContext('2d');
const K={bg:'#f3f4f6',ink:'#0f172a',sub:'#64748b',mute:'#94a3b8',line:'#e2e8f0',card:'#ffffff',
  blue:'#2563eb',blueS:'#dbeafe',red:'#dc2626',redS:'#fee2e2',green:'#16a34a',greenS:'#dcfce7',amber:'#d97706'};
const FF='Inter, "DejaVu Sans", sans-serif';
let x=O; // current draw target
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)), lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-cl(t),3), eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=cl(t);const s=1.4;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const pr=(t,d,len=.5)=>cl((t-d)/len);

// ---------- primitives ----------
function font(sz,w=700,mono){x.font=`${w} ${sz}px ${mono?'Mono, "DejaVu Sans Mono", monospace':FF}`}
function wrap(s,sz,w,maxW,mono){font(sz,w,mono);const out=[];for(const para of s.split('\n')){let l='';
  for(const wd of para.split(' ')){const tr=l?l+' '+wd:wd;if(x.measureText(tr).width>maxW&&l){out.push(l);l=wd}else l=tr}out.push(l)}return out}
function text(s,px,py,sz,col,o={}){const a=o.a??1;if(a<=.001)return 0;const w=o.w??700,lh=sz*(o.lh??1.18);
  const lines=wrap(s,sz,w,o.max??900,o.mono);x.save();x.globalAlpha*=a;font(sz,w,o.mono);x.fillStyle=col;
  x.textAlign=o.al??'left';x.textBaseline='middle';if(o.ls)x.letterSpacing=o.ls+'px';
  lines.forEach((l,i)=>x.fillText(l,px,py+i*lh+(o.dy??0)));x.restore();return lines.length*lh}
function rr(px,py,w,h,r,fill,stroke,lw=3,shadow){x.save();if(shadow){x.shadowColor='rgba(15,23,42,.10)';x.shadowBlur=40;x.shadowOffsetY=14}
  x.beginPath();x.roundRect(px,py,w,h,r);if(fill){x.fillStyle=fill;x.fill()}x.shadowColor='transparent';
  if(stroke){x.lineWidth=lw;x.strokeStyle=stroke;x.stroke()}x.restore()}
function tagPill(s,px,py,a=1,col=K.ink,al='left',sz=26){if(a<=0)return;font(sz,700);x.save();x.letterSpacing='3px';
  const w=x.measureText(s).width+48;x.restore();const X0=al==='center'?px-w/2:px;x.save();x.globalAlpha*=a;
  rr(X0,py-sz,w,sz*2,sz,'#fff',col===K.ink?'#cbd5e1':col,2.5);x.restore();text(s,X0+24,py+1,sz,col,{a,ls:3})}
function callout(s,px,py,a,col=K.blue){if(a<=0)return;const s2=.85+.15*back(a);x.save();x.translate(px,py);x.scale(s2,s2);
  font(28,800);x.letterSpacing='3px';const w=x.measureText(s).width+60;x.letterSpacing='0px';x.globalAlpha*=cl(a*2);
  rr(-w/2,-34,w,68,34,'#fff',col,3,true);text(s,0,1,28,col,{al:'center',w:800,ls:3});x.restore()}
function skel(px,py,w,h,a=1,col='#e5e7eb'){x.save();x.globalAlpha*=a;rr(px,py,w,h,h/2,col);x.restore()}
function isoLayer(cx,cy,w,d,h,a,hi){x.save();x.globalAlpha*=a;const L=[cx-w/2,cy],T=[cx,cy-d/2],R=[cx+w/2,cy],B=[cx,cy+d/2];
  x.fillStyle=hi?'#bfdbfe':'#c7d2fe';x.beginPath();x.moveTo(...L);x.lineTo(...B);x.lineTo(B[0],B[1]+h);x.lineTo(L[0],L[1]+h);x.fill();
  x.fillStyle=hi?'#93c5fd':'#a5b4fc';x.beginPath();x.moveTo(...B);x.lineTo(...R);x.lineTo(R[0],R[1]+h);x.lineTo(B[0],B[1]+h);x.fill();
  x.fillStyle=hi?'#eff6ff':'#eef2ff';x.strokeStyle=hi?K.blue:'#818cf8';x.lineWidth=2;x.beginPath();x.moveTo(...L);x.lineTo(...T);x.lineTo(...R);x.lineTo(...B);x.closePath();x.fill();x.stroke();
  x.save();x.transform(w/2/16,-d/2/16,w/2/16,d/2/16,L[0],L[1]);x.fillStyle=hi?'rgba(37,99,235,.55)':'rgba(79,70,229,.35)';
  for(let i=1;i<16;i++)for(let j=1;j<16;j++)if((i*7+j*13)%5)x.fillRect(i-.18,j-.18,.36,.36);x.restore();x.restore()}
function pageCard(px,py,w,h,a,o={}){if(a<=0)return;x.save();x.globalAlpha*=a;rr(px,py,w,h,18,'#fff',o.stroke??K.line,o.stroke?4:2,true);
  skel(px+24,py+28,w*.55,16,1,o.stroke?'#93c5fd':'#cbd5e1');for(let i=0;i<3;i++)skel(px+24,py+62+i*26,w-48-(i%2)*50,11);x.restore()}
function badge(s,cx,cy,a,col=K.blue){if(a<=0)return;x.save();x.globalAlpha*=a;x.translate(cx,cy);x.scale(back(a),back(a));
  x.beginPath();x.arc(0,0,30,0,7);x.fillStyle=col;x.fill();text(s,0,1,28,'#fff',{al:'center',w:800});x.restore()}
function crossBadge(cx,cy,a,r=34){if(a<=0)return;x.save();x.globalAlpha*=cl(a*2);x.translate(cx,cy);x.scale(back(a),back(a));
  x.beginPath();x.arc(0,0,r,0,7);x.fillStyle=K.red;x.fill();x.strokeStyle='#fff';x.lineWidth=r*.2;x.lineCap='round';
  const q=r*.38;x.beginPath();x.moveTo(-q,-q);x.lineTo(q,q);x.moveTo(q,-q);x.lineTo(-q,q);x.stroke();x.restore()}
function sparkle(cx,cy,r,col){x.save();x.translate(cx,cy);x.fillStyle=col;x.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4,rad=i%2?r*.28:r;x.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}x.fill();x.restore()}
function searchBar(px,py,w,q,shown,a,caret){if(a<=0)return;x.save();x.globalAlpha*=a;rr(px,py,w,120,60,'#fff',K.line,2,true);
  x.strokeStyle=K.sub;x.lineWidth=5;x.beginPath();x.arc(px+62,py+56,16,0,7);x.stroke();x.beginPath();x.moveTo(px+74,py+68);x.lineTo(px+88,py+82);x.stroke();
  const s=q.slice(0,shown);text(s,px+112,py+61,40,K.ink,{w:600,max:w-150});
  if(caret){font(40,600);const cw=x.measureText(s).width;if(Math.floor(caret*2.2)%2===0)rr(px+116+cw,py+36,4,50,2,K.blue)}x.restore()}
// headline with per-word stagger
function headline(s,t,t0,a=1){const ws=s.split(' ');font(76,800);let px=90,py=440,out=[];
  ws.forEach((w,i)=>{const ww=x.measureText(w+' ').width;if(px+ww>1000){px=90;py+=90}out.push([w,px,py,i]);px+=ww});
  out.forEach(([w,px,py,i])=>{const k=eo(pr(t,t0+i*.06,.45));text(w,px,py+(1-k)*30,76,K.ink,{a:k*a,w:800,max:2000})})}

// ---------- timeline helpers ----------
const S=TL.scenes;
function wt(i,word,n=0){const ws=S[i].words.filter(w=>w.w.toLowerCase().replace(/[^a-z0-9.'-]/g,'')===word.toLowerCase());
  return (ws[n]||ws[0]||{t:S[i].start}).t-S[i].start}

function quote(s,who,cx,cy,a,w=840){if(a<=0)return;x.save();x.globalAlpha*=cl(a*1.5);x.translate(0,(1-eo(a))*40);
  const lines=wrap(s,40,700,w-120);const h=lines.length*48+120;rr(cx-w/2,cy-h/2,w,h,28,'#fff',K.line,2,true);
  text('“',cx-w/2+36,cy-h/2+50,90,K.blue,{w:800});lines.forEach((l,i)=>text(l,cx-w/2+80,cy-h/2+62+i*48,40,K.ink,{w:700,max:3000}));
  text('— '+who,cx-w/2+80,cy+h/2-38,26,K.sub,{w:600});x.restore()}
function chip(s,cx,cy,a,col=K.ink,bg='#fff',sz=30,mono){if(a<=0)return;x.save();x.translate(cx,cy);const k=back(a);x.scale(k,k);x.globalAlpha*=cl(a*2);
  font(sz,700,mono);const w=x.measureText(s).width+50;rr(-w/2,-sz*1.05,w,sz*2.1,sz*1.05,bg,col===K.ink?K.line:col,2.5,true);text(s,0,2,sz,col,{al:'center',w:700,mono});x.restore()}
function phase(t,a,b,f=.35){return Math.min(eo(pr(t,a,f)),1-eo(pr(t,b-f,f)))} // fade in at a, out by b
// ---------- extra primitives ----------
const YEL='rgba(250,204,21,.55)';
function hl(px,py,w,h,p){if(p<=0)return;x.save();x.fillStyle=YEL;x.beginPath();x.roundRect(px,py,w*cl(p),h,6);x.fill();x.restore()}
function stamp(label,cx,cy,a,col=K.red,rot=-.12,sz=64){if(a<=0)return;const k=eo(a/.6),s=2.2-1.2*k;x.save();x.globalAlpha*=cl(a*3);x.translate(cx,cy);x.rotate(rot);x.scale(s,s);
  font(sz,800);x.letterSpacing='4px';const w=x.measureText(label).width+60;x.letterSpacing='0px';rr(-w/2,-sz*.85,w,sz*1.7,14,'rgba(255,255,255,.85)',col,7);text(label,0,3,sz,col,{al:'center',w:800,ls:4,max:3000});x.restore()}
function bot(cx,cy,name,col,a,sc=1){if(a<=0)return;x.save();x.globalAlpha*=cl(a*2);x.translate(cx,cy);const k=back(a)*sc;x.scale(k,k);
  x.strokeStyle=col;x.lineWidth=5;x.beginPath();x.moveTo(0,-70);x.lineTo(0,-95);x.stroke();x.beginPath();x.arc(0,-100,9,0,7);x.fillStyle=col;x.fill();
  rr(-62,-70,124,100,28,'#fff',col,5,true);const bl=(Math.floor(T_NOW*1.3+cx)%5===0)?2:14;
  rr(-34,-38,20,bl,6,col);rr(14,-38,20,bl,6,col);rr(-22,4,44,8,4,col);
  font(24,800);const w=x.measureText(name).width+36;rr(-w/2,50,w,46,23,col);text(name,0,74,24,'#fff',{al:'center',w:800,max:3000});x.restore()}
function person(cx,cy,s,col){x.fillStyle=col;x.beginPath();x.arc(cx,cy-s*.32,s*.2,0,7);x.fill();x.beginPath();x.roundRect(cx-s*.3,cy-s*.06,s*.6,s*.42,s*.18);x.fill()}
function answerCard(px,py,w,h,a,o={}){if(a<=0)return;x.save();x.globalAlpha*=a;rr(px,py,w,h,30,'#fff',K.line,2,true);sparkle(px+46,py+50,18,K.blue);
  text(o.title??'AI answer',px+76,py+51,30,K.ink,{w:700});const n=o.lines??4;for(let i=0;i<n;i++){const g=eio(pr(o.t??9,(o.t0??0)+i*.15,.5));skel(px+36,py+100+i*38,(i===n-1?w*.45:w-72)*g,14,1,i<2?'#dbeafe':'#e5e7eb')}x.restore()}
function srcChip(s,px,py,a,hi){if(a<=0)return;x.save();x.globalAlpha*=eo(a);font(24,700);const w=x.measureText(s).width+60;rr(px,py-(1-eo(a))*16,w,50,25,hi?K.blueS:'#f1f5f9',hi?K.blue:K.line,hi?3:2);
  x.strokeStyle=hi?K.blue:K.sub;x.lineWidth=3;x.beginPath();x.arc(px+24,py+25,6,0,7);x.stroke();text(s,px+40,py+26,24,hi?K.blue:K.sub,{w:700,max:3000});x.restore();return w}
function checkMark(cx,cy,r,a,col=K.green){if(a<=0)return;x.save();x.translate(cx,cy);x.scale(back(a),back(a));x.beginPath();x.arc(0,0,r,0,7);x.fillStyle=col;x.fill();
  x.strokeStyle='#fff';x.lineWidth=r*.24;x.lineCap='round';x.beginPath();x.moveTo(-r*.4,0);x.lineTo(-r*.1,r*.32);x.lineTo(r*.42,-r*.32);x.stroke();x.restore()}
let T_NOW=0;

// ---------- sources (switch on a spoken word) ----------
const SRC={paper:'Aggarwal et al., “GEO: Generative Engine Optimization,” KDD 2024 (arXiv 2311.09735)',
  gAI:'Google Search Central, “AI features and your website”',gOpt:'Google Search Central, “Optimizing your website for generative AI features”',
  oai:'OpenAI Help Center, “Publishers and Developers FAQ”',ms:'Microsoft Advertising blog, “Optimizing your content for inclusion in AI search answers,” Oct 2025',
  pew:'Pew Research Center, July 22, 2025 (browsing data from March 2025)',bing:'Bing Webmaster Blog, “AI Performance in Bing Webmaster Tools,” Feb 2026'};
const SOURCES=[
 [['term',SRC.paper]],
 [['Google',SRC.gAI]],
 [['Google',SRC.gOpt],['OpenAI',SRC.oai],['Microsoft',SRC.ms],['difference',null],['lifts',SRC.ms],['So',null]],
 [['Pew',SRC.pew]],
 [['researchers',SRC.paper]],
 [['crawlable',SRC.oai+' · '+SRC.ms.split(',')[0]],['write',SRC.ms],['specific',SRC.ms],['back',SRC.paper],['headings',SRC.ms],['original',SRC.gOpt]],
 [['llms.txt',SRC.gOpt],['Every',SRC.gOpt+' · OpenAI FAQ · Microsoft Advertising']],
 [['Search',SRC.gAI],['Bing',SRC.bing],['track',SRC.oai],['wary',SRC.gOpt],['isn\'t',null]]];
function srcAt(si,lt){let s=null;for(const [w,v] of SOURCES[si]){if(lt>=wt(si,w)-.1)s=v}return s}

// ---------- scenes ----------
const HEADS=['What is GEO?','How AI search picks sources','GEO vs. SEO','Why it matters now','What the research found','The GEO checklist','Three myths','How to measure it'];
const TAGS=['01 · WHAT IS GEO','02 · HOW AI SEARCH WORKS','03 · GEO VS SEO','04 · WHY IT MATTERS','05 · THE RESEARCH','06 · THE CHECKLIST','07 · MYTHS','08 · MEASURE IT'];
const SC=[
// 0 WHAT IS GEO
t=>{headline(HEADS[0],t,.1);const tten=wt(0,'ten'),tone=wt(0,'one'),tsrc=wt(0,'sources'),tgeo=wt(0,'GEO'),tterm=wt(0,'term'),tpr=wt(0,'Princeton');
  // A: assistants + old-style results collapsing into one answer
  const A=1-eo(pr(t,tgeo-.3,.4));if(A>0){x.save();x.globalAlpha*=A;
    [['ChatGPT',wt(0,'ChatGPT')],['Perplexity',wt(0,'Perplexity')],['Google AI',wt(0,'AI')]].forEach(([s,tt],i)=>chip(s,[250,540,830][i],650,pr(t,tt-.1,.4),K.ink,'#fff',30));
    const col=eo(pr(t,tone-.2,.8));
    for(let i=0;i<10;i++){const k=eo(pr(t,tten-.4+i*.06,.35));if(k<=0)continue;const py=lerp(760+i*62,900,col),sc=1-col*.9;x.save();x.globalAlpha*=k*(1-col);
      x.translate(540,py);x.scale(1,sc);rr(-450,-24,900,52,12,'#fff',K.line,2);rr(-420,-10,260+(i*37)%180,12,6,'#93c5fd');rr(-420,8,560-(i*53)%200,8,4,'#e5e7eb');x.restore()}
    text('10 blue links',540,1420,30,K.sub,{al:'center',w:700,a:eo(pr(t,tten,.4))*(1-col)});
    answerCard(140,800,800,420,eo(pr(t,tone,.5)),{t,t0:tone+.2,lines:5});
    let cx=180;['site-a.com','site-b.com','site-c.com'].forEach((s,i)=>{cx+=srcChip(s,cx,1130,pr(t,tsrc+i*.15,.4))+14});
    text('1 written answer + a few cited sources',540,1300,32,K.ink,{al:'center',w:700,a:eo(pr(t,tsrc+.4,.4))});x.restore()}
  // B: G E O tiles
  const B=Math.min(eo(pr(t,tgeo-.2,.4)),1-eo(pr(t,tterm-.3,.4))*.0);if(B>0&&t<tterm+.2){x.save();x.globalAlpha*=B*(1-eo(pr(t,tterm-.2,.4)));
    const words=[['G','Generative',wt(0,'Generative')],['E','Engine',wt(0,'Engine')],['O','Optimization',wt(0,'Optimization')]];
    words.forEach(([l,w,tt],i)=>{const k=back(pr(t,tgeo+i*.1,.45));x.save();x.translate(300+i*240,850);x.scale(k,k);rr(-100,-120,200,240,34,'#fff',i===0?K.blue:K.line,i===0?4:2,true);text(l,0,6,150,i===0?K.blue:K.ink,{al:'center',w:800});x.restore();
      text(w,300+i*240,1025,32,K.sub,{al:'center',w:700,a:eo(pr(t,tt,.3))})});
    const g=eo(pr(t,wt(0,'getting')-.2,.5));if(g>0){x.save();x.globalAlpha*=g;rr(140,1110,800,160,28,K.blueS);
      text('= getting your content',540,1165,40,K.ink,{al:'center',w:800});text('into the AI answer',540,1220,40,K.blue,{al:'center',w:800});x.restore()}x.restore()}
  // C: the paper
  const C=eo(pr(t,tterm-.1,.5));if(C>0){x.save();x.globalAlpha*=C;x.translate(0,(1-C)*80);rr(150,640,780,820,12,'#fff',K.line,2,true);
    text('arXiv:2311.09735',190,690,22,K.mute,{w:600,mono:true});
    text('GEO: Generative Engine',540,790,46,K.ink,{al:'center',w:800});text('Optimization',540,845,46,K.ink,{al:'center',w:800});
    hl(330,815,420,56,pr(t,tterm+.5,.8));text('Optimization',540,845,46,K.ink,{al:'center',w:800});
    text('Aggarwal · Murahari · Rajpurohit',540,930,26,K.sub,{al:'center',w:600});text('Kalyan · Narasimhan · Deshpande',540,968,26,K.sub,{al:'center',w:600});
    text('Abstract',190,1050,26,K.ink,{w:800});for(let i=0;i<7;i++)skel(190,1085+i*34,i===6?380:700,12);
    chip('Princeton',330,1370,pr(t,tpr-.1,.4),K.amber,'#fffbeb',28);chip('KDD 2024',720,1370,pr(t,wt(0,'KDD')-.1,.4),K.blue,K.blueS,28);x.restore()}},
// 1 HOW AI SEARCH WORKS
t=>{headline(HEADS[1],t,.1);const ts=wt(1,'searches'),tsev=wt(1,'several'),tfan=wt(1,'fan-out'),tr=wt(1,'reads'),tw=wt(1,'writes'),tc=wt(1,'citing'),tb=wt(1,'before');
  const cx=540,cy=900,out=eo(pr(t,tb-.3,.4));
  if(out<1){x.save();x.globalAlpha*=1-out;
    const subs=['for coding','under $800','battery life','reviews'];
    subs.forEach((s,i)=>{const ang=Math.PI+(i+.5)*Math.PI/4*2/2*2- Math.PI/2,k=eo(pr(t,tsev+i*.15,.5));const sx=[190,410,670,890][i],sy=700+Math.abs(i-1.5)*-0+ (i%2?40:0);
      if(k<=0)return;x.save();x.strokeStyle=K.blue;x.globalAlpha*=.55*k;x.lineWidth=3;x.setLineDash([12,10]);x.lineDashOffset=-t*50;x.beginPath();x.moveTo(cx,cy);x.lineTo(lerp(cx,sx,k),lerp(cy,sy,k));x.stroke();x.restore();
      chip(s,sx,sy,k,K.ink,'#fff',26);
      // pages flowing back once reading starts
      if(t>tr-.3)for(let j=0;j<2;j++){const f=((t-(tr-.3))*.8+j/2)%1,rd=t>tw+.5?1-eo(pr(t,tw+.5,.4)):1;x.save();x.globalAlpha*=Math.sin(f*Math.PI)*rd;rr(lerp(sx,cx,f)-16,lerp(sy+40,cy,f)-20,32,40,5,'#fff',K.blue,2.5);x.restore()}});
    const k=back(pr(t,.3,.5));x.save();x.translate(cx,cy);x.scale(k,k);rr(-240,-62,480,124,62,K.ink);sparkle(-180,0,18,'#93c5fd');text('best laptop for students?',-150,2,30,'#fff',{w:700});x.restore();
    if(t>ts)text('searching the web…',cx,cy+100,26,K.sub,{al:'center',w:600,a:phase(t,ts,tsev+.2)});
    callout('QUERY FAN-OUT',cx,cy+110,pr(t,tfan-.2,.5));
    // reading scan
    const rd=phase(t,tr-.1,tw+.6);if(rd>0){x.save();x.globalAlpha*=rd;for(let i=0;i<3;i++)pageCard(240+i*220,1090,190,150,1);const sy=1090+((t-tr)*180)%150;rr(230,sy,640,6,3,'rgba(37,99,235,.6)');x.restore();text('reading the pages',cx,1280,26,K.sub,{al:'center',w:600,a:rd})}
    answerCard(140,1090,800,330,eo(pr(t,tw-.1,.5)),{t,t0:tw,lines:3});
    let px=180;['site-a.com','site-b.com','site-c.com'].forEach((s,i)=>{px+=srcChip(s,px,1340,pr(t,tc+i*.15,.4))+14});x.restore()}
  // two-step takeaway
