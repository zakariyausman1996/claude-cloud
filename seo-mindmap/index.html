function show(d){const x=d.data;if(x.url)info.innerHTML=`<b>${esc(x.name)}</b> — <a href="${x.url}" target="_blank" rel="noopener">open the Google guide ↗</a>`;
 else info.innerHTML=`<b>${esc(x.name)}</b>${x.desc?' — '+esc(x.desc):''} <span>(${d._c?d._c.length:0} topics)</span>`}
function draw(){tree(root);const n=root.descendants(),l=root.links();
 g.selectAll('.link').data(l,d=>d.target.id).join('path').attr('class','link').attr('d',d3.linkHorizontal().x(d=>d.y).y(d=>d.x));
 const s=g.selectAll('.node').data(n,d=>d.id).join(e=>{const k=e.append('g');k.append('circle').attr('r',7);k.append('text').attr('dy','.32em');return k})
  .attr('class',d=>'node'+(d.data.url?' leaf':'')+(d._c&&!d.children?' collapsed':'')+(d.hit?' hit':'')).attr('transform',d=>`translate(${d.y},${d.x})`)
  .on('click',(e,d)=>{show(d);if(d.data.url)return window.open(d.data.url,'_blank','noopener');d.children=d.children?null:d._c;draw()});
 s.select('text').attr('x',d=>d.depth?12:-12).attr('text-anchor',d=>d.depth?'start':'end').text(d=>d.data.name);
 s.select('circle').attr('r',d=>d.data.url?5:8)}
function center(){const r=svg.node().getBoundingClientRect();svg.call(d3.zoom().on('zoom',e=>g.attr('transform',e.transform)).transform,d3.zoomIdentity.translate(r.width<600?60:120,r.height/2).scale(r.width<600?.7:1))}
document.getElementById('exp').onclick=()=>{walk(root,d=>d.children=d._c);draw()};
document.getElementById('col').onclick=()=>{walk(root,d=>{if(d.depth>0)d.children=null});root.children=root._c;draw();center()};
document.getElementById('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();walk(root,d=>{d.hit=false;if(d.depth>0)d.children=null});root.children=root._c;let c=0;
 if(q)walk(root,d=>{if(d.depth&&d.data.name.toLowerCase().includes(q)){d.hit=true;c++;d.ancestors().slice(1).forEach(a=>a.children=a._c);if(d._c)d.children=d._c}});
 info.textContent=q?`${c} matching topic${c==1?'':'s'} highlighted.`:'Click a bubble to open it.';draw()};
root.children=root._c;draw();center();show(root);
</script></body></html>
